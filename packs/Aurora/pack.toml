# Aurora: bright, natural and vivid. Its design: docs/dev/AURORA.md in prisma-shaders.

name = "Aurora"
description = "Bright and natural: a deep blue sky with white volumetric clouds, sunbeams through the leaves, soft shadows, glowing foliage, sparkling mirror water and warm lanterns at night. Potato to Ultra profiles."
author = "Kohavi"
version = "0.1"
api = 1
license = "GPL-3.0-or-later AND CC-BY-4.0 AND CC0-1.0"

# Prisma's shadows, G-buffer and overhead map; Luanti's own clouds,
# post-processing and underwater tint are hidden.
gbuffer = true
# Potato keeps the G-buffer to 64 nodes (the profile's numbers; 0 = all)
gbuffer_distance = "profile"
hide = ["clouds", "shadows", "bloom", "volumetric_light", "exposure", "tonemapping", "underwater"]

# Luanti settings while playing through Prisma. The pack replaces Luanti's
# fog and waves.
[luanti]
enable_post_processing = true
enable_dynamic_shadows = false
enable_bloom = false
enable_volumetric_lighting = false
enable_auto_exposure = false
tone_mapping = false
enable_water_reflections = false
enable_fog = true
fog_start = 0.7
enable_waving_water = false

[shadows]
resolution = "shadow_resolution"
distance = "shadow_distance"
# Under a hidden sky: a glow low on the horizon that casts shadows
hidden_sky_light = [1.0, 0.18, 0.0]   # in the east, 10 degrees up

# The overhead map also gives reflections the land off screen
[overhead]
resolution = 1024
distance = 96

# ---- Buffers (see passes/) -------------------------------------------------

[buffers.state]             # (0, 0) exposure, (1, 0) under the water surface or not
size = [2, 1]
format = "rgba32f"
filter = "nearest"

[buffers.noiseTex]          # tileable noise (00_noise.frag): one fetch per 3D octave
size = [257, 257]
format = "rgba16f"
filter = "linear"

[buffers.skymap]            # sky + clouds of the whole upper hemisphere (reflections)
size = [192, 192]
format = "rgba16f"
filter = "linear"

[buffers.clouds]            # the cloud layer: rgb = its light, a = its opacity
scale = 0.5
format = "rgba16f"

[buffers.ao]                # ambient occlusion (r) and distance (g)
scale = 0.5
format = "rgba16f"
filter = "nearest"

[buffers.fog]               # volumetric fog: rgb = light it adds, a = distance + transmittance
scale = 0.5
format = "rgba32f"
filter = "nearest"

[buffers.bloom1]
scale = 0.5
format = "rgba16f"

[buffers.bloom2]
scale = 0.25
format = "rgba16f"

[buffers.bloom3]
scale = 0.125
format = "rgba16f"

[buffers.bloom4]
scale = 0.0625
format = "rgba16f"

[buffers.bloom5]
scale = 0.03125
format = "rgba16f"

# ---- Quality -------------------------------------------------------------------

[options.profile]
label = "Profile"
type = "choice"
values = ["potato", "low", "medium", "high", "ultra"]
numbers = [64, 0, 0, 0, 0]   # gbuffer_distance
default = "medium"
group = "Quality"
description = "The samples of every expensive effect at once: light shafts, clouds, shadow filtering, ambient occlusion, reflections and contact shadows. Ultra is the best Aurora can do; lower it if the game runs slowly. Potato is for weak graphics: plainer light shafts, clouds, mist, shadows and reflections, no motion blur, and the finer light only up to 64 nodes away; with Shadow resolution at 1024 it runs faster still."

[options.shadow_resolution]
label = "Shadow resolution"
type = "choice"
values = ["1024", "2048", "4096"]
default = "2048"
group = "Quality"

# ---- Modules: whole effects off, with their cost ----------------

[options.clouds]
label = "Clouds"
type = "bool"
default = true
group = "Modules"
description = "The volumetric clouds and their shadows. Off: a clear sky."

[options.atmosphere]
label = "Atmosphere"
type = "bool"
default = true
group = "Modules"
description = "The haze, the morning mist and the light shafts. Off: clear air; the land still fades into the sky at the edge of the view."

[options.shadows]
label = "Sun shadows"
type = "bool"
default = true
group = "Modules"

[options.ao]
label = "Ambient occlusion"
type = "bool"
default = true
group = "Modules"
description = "Corners, crevices and the ground beside walls darken. Its strength and radius are under Shadows."

# ---- Atmosphere ------------------------------------------------------------------

[options.fog_density]
label = "Haze"
type = "float"
default = 0.0013
min = 0.0
max = 0.03
step = 0.0002
group = "Atmosphere"
description = "How thick the air is: it carries the light shafts and turns the distance blue."

[options.fog_falloff]
label = "Haze falloff"
type = "float"
default = 0.035
min = 0.005
max = 0.15
step = 0.005
group = "Atmosphere"
description = "How fast the haze thins out with height. Low: hazy all the way up; high: clear air above the valleys."

[options.fog_height]
label = "Mist height"
type = "float"
default = 6.0
min = -40.0
max = 200.0
step = 2.0
group = "Atmosphere"
description = "World height (nodes) below which the morning mist gathers and the haze is thickest."

[options.mist]
label = "Morning mist"
type = "float"
default = 0.4
min = 0.0
max = 1.0
step = 0.05
group = "Atmosphere"
description = "Banks of mist drifting through the low ground, thicker at dawn. 0 = none."

[options.shafts]
label = "Light shafts"
type = "float"
default = 1.8
min = 0.0
max = 3.0
step = 0.05
group = "Atmosphere"
description = "How much the air lights up towards the sun: the beams through the leaves and the windows."

[options.sky_haze]
label = "Horizon haze"
type = "float"
default = 0.35
min = 0.0
max = 1.0
step = 0.05
group = "Atmosphere"
description = "The distance melts into the sky. 0 = the horizon stays sharp."

[options.northern_lights]
label = "Northern lights"
type = "float"
default = 0.0
min = 0.0
max = 2.0
step = 0.05
group = "Atmosphere"
description = "Green and violet curtains of light over the night sky, most of them towards the north. They light nothing. 0 = none."

[options.horizon_glow]
label = "Glow of a hidden sky"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05
group = "Atmosphere"
description = "Where the game hides the sky (a realm underground), a band of fiery light along the horizon that lights the haze, rims what faces it and shines through the gaps. 0 = none: only the lamps."

[options.rainbows]
label = "Rainbows"
